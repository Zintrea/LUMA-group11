<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMA - Remove Background (F2)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg topbar px-3 py-2 navbar-dark">
    <div class="container-fluid p-0">
      <a class="navbar-brand text-white fw-bold me-4" href="#"><i class="bi bi-stars text-primary"></i> LUMA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#lumaNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="lumaNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
          <li class="nav-item"><a class="nav-link" href="txt2img.html"><i class="bi bi-image me-1"></i> Text to Image</a></li>
          <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="rembg.html"><i class="bi bi-person-bounding-box me-1"></i> Remove Background</a></li>
          <li class="nav-item"><a class="nav-link" href="upscale.html"><i class="bi bi-arrows-angle-expand me-1"></i> Upscale Image</a></li>
          <li class="nav-item"><a class="nav-link" href="inpaint.html"><i class="bi bi-brush me-1"></i> Inpaint & Repair</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <span class="text-secondary small me-3"><i class="bi bi-person-circle me-1"></i> User</span>
          <a href="login.html" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-0">
    <div class="row g-0">
      <div class="col-md-4 col-lg-3 sidebar p-4">
        <h6 class="text-uppercase text-muted fw-bold mb-3 small">1. Image Setup</h6>
        <div class="mb-4">
          <label for="imageUpload" class="form-label small text-light">Upload Image</label>
          <input class="form-control form-control-sm bg-dark text-light border-secondary" type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp">
        </div>
        <hr class="border-secondary">
        <h6 class="text-uppercase text-muted fw-bold mb-3 small">2. Action</h6>
        <button id="btnProcess" class="btn btn-primary w-100 fw-bold py-2" disabled><i class="bi bi-eraser-fill me-1"></i> Remove Background</button>
        <button id="btnDownload" class="btn btn-success w-100 fw-bold py-2 mt-2 d-none"><i class="bi bi-download me-1"></i> Download Result</button>
      </div>

      <div class="col-md-8 col-lg-9 workspace">
        <div id="imageResultContainer" class="checkerboard">
          <span id="emptyState" class="text-muted"><i class="bi bi-image me-1"></i> Upload an image to start</span>
          <div id="loadingState" class="d-none text-center">
            <div class="spinner-border text-primary mb-2" role="status" style="width: 3rem; height: 3rem;"></div>
            <div class="text-light fw-bold">Removing background...</div>
            <div class="text-muted small">This takes about 1-3 seconds.</div>
          </div>
          <img id="resultImage" class="d-none" src="" alt="Image Preview">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/rembg.js"></script>
</body>
</html>
