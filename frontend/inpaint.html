<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMA - Inpaint & Repair (F4)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg topbar px-3 py-2 navbar-dark">
    <div class="container-fluid p-0">
      <a class="navbar-brand text-white fw-bold me-4" href="#"><i class="bi bi-stars text-primary"></i> LUMA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#lumaNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="lumaNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
          <li class="nav-item"><a class="nav-link" href="txt2img.html"><i class="bi bi-image me-1"></i> Text to Image</a></li>
          <li class="nav-item"><a class="nav-link" href="rembg.html"><i class="bi bi-person-bounding-box me-1"></i> Remove Background</a></li>
          <li class="nav-item"><a class="nav-link" href="upscale.html"><i class="bi bi-arrows-angle-expand me-1"></i> Upscale Image</a></li>
          <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="inpaint.html"><i class="bi bi-brush me-1"></i> Inpaint & Repair</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <span class="text-secondary small me-3"><i class="bi bi-person-circle me-1"></i> User</span>
          <a href="login.html" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-0">
    <div class="row g-0">
      <div class="col-md-4 col-lg-3 sidebar p-4">
        <h6 class="text-uppercase text-muted fw-bold mb-3 small">1. Image Setup</h6>
        <div class="mb-4">
          <input class="form-control form-control-sm bg-dark text-light border-secondary" type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp">
        </div>
        <h6 class="text-uppercase text-muted fw-bold mb-3 small">2. Mask Tools</h6>
        <div class="d-flex flex-column mb-3">
          <button id="btnBrush" class="btn btn-tool active"><i class="bi bi-brush-fill me-2"></i> Draw Mask</button>
          <button id="btnErase" class="btn btn-tool"><i class="bi bi-eraser-fill me-2"></i> Erase</button>
          <button id="btnClear" class="btn btn-tool text-danger"><i class="bi bi-trash3-fill me-2"></i> Clear Canvas</button>
        </div>
        <div class="mb-4">
          <label for="brushSize" class="form-label small text-muted">Brush Size: <span id="brushSizeVal" class="text-light">20</span>px</label>
          <input type="range" class="form-range" id="brushSize" min="5" max="100" value="20">
        </div>
        <hr class="border-secondary">
        <h6 class="text-uppercase text-muted fw-bold mb-3 small">3. Action</h6>
        <button id="btnGenerate" class="btn btn-primary w-100 mb-2 fw-bold"><i class="bi bi-cpu me-1"></i> Send to AI</button>
        <button id="btnExport" class="btn btn-success w-100 fw-bold"><i class="bi bi-file-earmark-arrow-down me-1"></i> Export Mask</button>
      </div>

      <div class="col-md-8 col-lg-9 workspace">
        <div id="canvasContainer">
          <canvas id="imageCanvas"></canvas>
          <canvas id="maskCanvas"></canvas>
          <span id="placeholderText" class="text-muted"><i class="bi bi-image me-1"></i> Upload an image to start</span>
        </div>
        <div class="mt-3 text-secondary small">
          <i class="bi bi-info-circle me-1"></i> Draw a white mask over the area you want the AI to modify.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/inpaint.js"></script>
</body>
</html>
