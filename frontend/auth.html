<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMA AI - Sign In / Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body py-4">

  <div class="container d-flex justify-content-center">
    <div class="card auth-card bg-dark border-secondary shadow-lg">
      <div class="card-body p-4 p-md-5">
        
        <div class="text-center mb-4">
          <h2 class="text-white fw-bold"><i class="bi bi-stars text-primary"></i> LUMA</h2>
          <p class="text-muted small">Welcome to AI Image Generation</p>
        </div>

        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Sign Up</button>
          </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
          
          <!-- ฟอร์ม Sign In -->
          <div class="tab-pane fade show active" id="login-pane" role="tabpanel" tabindex="0">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label small text-light">Email address</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control bg-dark text-light border-secondary" id="loginEmail" placeholder="name@example.com" required>
                </div>
              </div>
              <div class="mb-4">
                <div class="d-flex justify-content-between">
                  <label for="loginPassword" class="form-label small text-light">Password</label>
                  <a href="#" class="small text-decoration-none text-primary">Forgot password?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control bg-dark text-light border-secondary" id="loginPassword" placeholder="••••••••" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Sign In</button>
            </form>
          </div>

          <!-- ฟอร์ม Sign Up -->
          <div class="tab-pane fade" id="register-pane" role="tabpanel" tabindex="0">
            <form id="registerForm">
              <div class="mb-3">
                <label for="regUsername" class="form-label small text-light">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control bg-dark text-light border-secondary" id="regUsername" placeholder="Choose a username" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label small text-light">Email address</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control bg-dark text-light border-secondary" id="regEmail" placeholder="name@example.com" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label small text-light">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control bg-dark text-light border-secondary" id="regPassword" placeholder="Create a password" required>
                </div>
              </div>
              <div class="mb-4">
                <label for="regConfirm" class="form-label small text-light">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-shield-lock"></i></span>
                  <input type="password" class="form-control bg-dark text-light border-secondary" id="regConfirm" placeholder="Repeat your password" required>
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100 fw-bold py-2">Create Account</button>
            </form>
          </div>
          
        </div>
        
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
