<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>LUMA AI - Sign In / Register</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- LUMA CSS -->
  <link
    rel="stylesheet"
    href="/css/style.css"
  >
</head>


<body class="auth-body py-4">

  <div class="container d-flex justify-content-center">

    <div class="card auth-card bg-dark border-secondary shadow-lg">

      <div class="card-body p-4 p-md-5">


        <!-- ==========================================
             Header
        =========================================== -->

        <div class="text-center mb-4">

          <h2 class="text-white fw-bold">

            <i class="bi bi-stars text-primary"></i>

            LUMA

          </h2>

          <p class="text-muted small">
            Welcome to AI Image Generation
          </p>

        </div>


        <!-- ==========================================
             Tabs
        =========================================== -->

        <ul
          class="nav nav-pills nav-justified mb-4"
          id="authTabs"
          role="tablist"
        >

          <!-- Sign In -->
          <li
            class="nav-item"
            role="presentation"
          >

            <button
              class="nav-link active fw-bold"
              id="login-tab"
              data-bs-toggle="pill"
              data-bs-target="#login-pane"
              type="button"
              role="tab"
              aria-controls="login-pane"
              aria-selected="true"
            >
              Sign In
            </button>

          </li>


          <!-- Sign Up -->
          <li
            class="nav-item"
            role="presentation"
          >

            <button
              class="nav-link fw-bold"
              id="register-tab"
              data-bs-toggle="pill"
              data-bs-target="#register-pane"
              type="button"
              role="tab"
              aria-controls="register-pane"
              aria-selected="false"
            >
              Sign Up
            </button>

          </li>

        </ul>


        <!-- ==========================================
             Tab Content
        =========================================== -->

        <div
          class="tab-content"
          id="authTabsContent"
        >


          <!-- ========================================
               SIGN IN
          ========================================= -->

          <div
            class="tab-pane fade show active"
            id="login-pane"
            role="tabpanel"
            aria-labelledby="login-tab"
            tabindex="0"
          >

            <form id="loginForm">


              <!-- Username -->
              <div class="mb-3">

                <label
                  for="loginUsername"
                  class="form-label small text-light"
                >
                  Username
                </label>

                <div class="input-group">

                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                  >
                    <i class="bi bi-person"></i>
                  </span>

                  <input
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    id="loginUsername"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                  >

                </div>

              </div>


              <!-- Password -->
              <div class="mb-4">

                <div class="d-flex justify-content-between">

                  <label
                    for="loginPassword"
                    class="form-label small text-light"
                  >
                    Password
                  </label>

                  <a
                    href="#"
                    class="small text-decoration-none text-primary"
                  >
                    Forgot password?
                  </a>

                </div>

                <div class="input-group">

                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                  >
                    <i class="bi bi-lock"></i>
                  </span>

                  <input
                    type="password"
                    class="form-control bg-dark text-light border-secondary"
                    id="loginPassword"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  >

                </div>

              </div>


              <!-- Sign In Button -->
              <button
                type="submit"
                class="btn btn-primary w-100 fw-bold py-2"
              >
                Sign In
              </button>

            </form>

          </div>



          <!-- ========================================
               SIGN UP
          ========================================= -->

          <div
            class="tab-pane fade"
            id="register-pane"
            role="tabpanel"
            aria-labelledby="register-tab"
            tabindex="0"
          >

            <form id="registerForm">


              <!-- Username -->
              <div class="mb-3">

                <label
                  for="regUsername"
                  class="form-label small text-light"
                >
                  Username
                </label>

                <div class="input-group">

                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                  >
                    <i class="bi bi-person"></i>
                  </span>

                  <input
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    id="regUsername"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                  >

                </div>

              </div>


              <!-- Email -->
              <div class="mb-3">

                <label
                  for="regEmail"
                  class="form-label small text-light"
                >
                  Email address
                </label>

                <div class="input-group">

                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                  >
                    <i class="bi bi-envelope"></i>
                  </span>

                  <input
                    type="email"
                    class="form-control bg-dark text-light border-secondary"
                    id="regEmail"
                    name="email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    required
                  >

                </div>

              </div>


              <!-- Password -->
              <div class="mb-3">

                <label
                  for="regPassword"
                  class="form-label small text-light"
                >
                  Password
                </label>

                <div class="input-group">

                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                  >
                    <i class="bi bi-lock"></i>
                  </span>

                  <input
                    type="password"
                    class="form-control bg-dark text-light border-secondary"
                    id="regPassword"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                  >

                </div>

              </div>


              <!-- Confirm Password -->
              <div class="mb-4">

                <label
                  for="regConfirm"
                  class="form-label small text-light"
                >
                  Confirm Password
                </label>

                <div class="input-group">

                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                  >
                    <i class="bi bi-shield-lock"></i>
                  </span>

                  <input
                    type="password"
                    class="form-control bg-dark text-light border-secondary"
                    id="regConfirm"
                    name="confirm_password"
                    placeholder="Repeat your password"
                    autocomplete="new-password"
                    required
                  >

                </div>

              </div>


              <!-- Register Button -->
              <button
                type="submit"
                class="btn btn-success w-100 fw-bold py-2"
              >
                Create Account
              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- Bootstrap JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- Auth JS -->
  <!-- v3 = บังคับ Browser โหลดไฟล์ใหม่ -->

  <script src="/js/auth.js?v=3"></script>

</body>
</html>
