<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMA - AI Image Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg topbar px-3 py-2 navbar-dark border-bottom border-secondary">
    <div class="container-fluid p-0">
      <a class="navbar-brand text-white fw-bold me-4" href="/generate">
        <i class="bi bi-stars text-primary"></i> LUMA
      </a>
      
      <div class="d-flex align-items-center ms-auto">
        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center text-white border-0 bg-transparent" type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="https://ui-avatars.com/api/?name=User&background=random" id="navProfilePic" class="rounded-circle me-2 shadow-sm" alt="Profile" style="width: 35px; height: 35px; object-fit: cover;">
            <span id="currentUser" class="fw-bold me-1">User</span>
          </button>
          
          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow-lg mt-2 border-secondary" aria-labelledby="userMenuButton">
            <li class="px-3 py-2 text-center border-bottom border-secondary mb-2">
              <span class="d-block small text-muted mb-1">Available Credits</span>
              <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill">Unlimited</span>
            </li>
            
            <!-- ซ่อน History/Profile/Change Password ไว้ก่อนด้วยคลาส d-none -->
            <li class="d-none">
              <a class="dropdown-item py-2 fw-semibold" href="#" data-bs-toggle="offcanvas" data-bs-target="#historyOffcanvas">
                <i class="bi bi-clock-history me-2 text-info"></i> Generation History
              </a>
            </li>
            <li class="d-none">
              <a class="dropdown-item py-2 fw-semibold" href="#" data-bs-toggle="modal" data-bs-target="#profileModal">
                <i class="bi bi-person-bounding-box me-2 text-warning"></i> Edit Profile
              </a>
            </li>
            <li class="d-none">
              <a class="dropdown-item py-2 fw-semibold" href="#" data-bs-toggle="modal" data-bs-target="#passwordModal">
                <i class="bi bi-shield-lock me-2 text-success"></i> Change Password
              </a>
            </li>
            
            <li><hr class="dropdown-divider border-secondary my-2"></li>
            
            <li>
              <button class="dropdown-item py-2 text-danger fw-bold" id="btnLogoutDropdown">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-0">
    <div class="row g-0">

      <!-- Sidebar -->
      <div class="col-md-4 col-lg-3 sidebar p-4 border-end border-secondary" style="min-height: calc(100vh - 65px);">
        <h6 class="text-uppercase text-muted fw-bold mb-3 small">Prompt Engineering</h6>
        <div class="mb-3">
          <label for="promptInput" class="form-label small text-light">Prompt</label>
          <textarea class="form-control bg-dark text-light border-secondary shadow-sm" id="promptInput" rows="4" placeholder="e.g., A cute cat, anime style, high quality..."></textarea>
          <div class="invalid-feedback">Please enter a prompt before generating.</div>
        </div>

        <div class="mb-4">
          <label for="negativePromptInput" class="form-label small text-muted">Negative Prompt</label>
          <textarea class="form-control bg-dark text-light border-secondary shadow-sm" id="negativePromptInput" rows="3" placeholder="e.g., ugly, blurry, low resolution..."></textarea>
        </div>

        <hr class="border-secondary">

        <h6 class="text-uppercase text-muted fw-bold mb-3 small">2. Model Settings</h6>
        <div class="mb-4">
          <label class="form-label small text-muted">AI Model (Checkpoint)</label>
          <select class="form-select bg-dark text-light border-secondary shadow-sm" id="aiModel">
            <option value="Realistic">Realistic / Photography</option>
            <option value="Anime">Anime / 2D Art</option>
          </select>
        </div>

        <hr class="border-secondary">

        <h6 class="text-uppercase text-muted fw-bold mb-3 small">3. Action</h6>
        <button id="btnGenerate" class="btn btn-primary w-100 fw-bold py-2 shadow">
          <i class="bi bi-magic me-1"></i> Generate Image
        </button>
      </div>

      <!-- Workspace -->
      <div class="col-md-8 col-lg-9 workspace d-flex align-items-center justify-content-center bg-dark" style="min-height: calc(100vh - 65px);">
        <div id="imageResultContainer" class="text-center p-4">
          <span id="emptyState" class="text-muted d-block p-5 border border-secondary border-dashed rounded bg-dark bg-opacity-50">
            <i class="bi bi-image display-4 d-block mb-3 text-secondary"></i>
            AI generated image will appear here
          </span>

          <div id="loadingState" class="d-none text-center p-5">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 4rem; height: 4rem;"></div>
            <h5 class="text-light fw-bold">Generating image...</h5>
            <p class="text-muted small">This may take 10-30 seconds.</p>
          </div>

          <img id="resultImage" class="d-none img-fluid shadow-lg rounded" src="" alt="Generated AI Image" style="max-height: 70vh; object-fit: contain;">

          <div id="downloadContainer" class="d-none text-center mt-4">
            <button id="btnDownload" class="btn btn-success fw-bold px-4 py-2 shadow">
              <i class="bi bi-download me-2"></i> Save Image
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/script.js?v=8"></script>
</body>
</html>
